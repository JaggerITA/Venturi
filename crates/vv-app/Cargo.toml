[package]
name = "vv-app"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36.2"
env_logger = "0.11.11"
png = "0.18"
rfd = "0.17.2"
rust-i18n = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3"
vv-audio = { version = "0.1.0", path = "../vv-audio" }
vv-core = { version = "0.1.0", path = "../vv-core" }
vv-media = { version = "0.1.0", path = "../vv-media" }
vv-render = { version = "0.1.0", path = "../vv-render" }


[target.'cfg(target_os = "linux")'.dependencies]
# Dipendenza diretta solo per la feature: senza, le decorazioni client-side
# di winit disegnano i pulsanti ma non il titolo della finestra.
winit = { version = "0.30.13", features = ["wayland-csd-adwaita"] }
raw-window-handle = "0.6.2"
sctk = { package = "smithay-client-toolkit", version = "0.20.0", default-features = false }
wayland-backend = { version = "0.3.17", features = ["client_system"] }
