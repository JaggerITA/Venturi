name: Release

# On a v* tag it builds everything and publishes the release; run manually
# it only builds, leaving the files as artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # A tag whose name differs from the Cargo version would ship a release
  # whose metadata lies; scripts/release.sh keeps the two in sync.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $cargo_version (use scripts/release.sh)"
            exit 1
          fi

  appimage:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The compiled FFmpeg only changes with its build script or the image.
      - uses: actions/cache@v4
        with:
          path: target/ffmpeg-shared
          key: ffmpeg-appimage-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'container/Containerfile.appimage') }}

      - uses: actions/cache@v4
        with:
          path: target/cargo-registry
          key: cargo-registry-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.arch }}-

      - name: Build image
        run: docker build -t venturi-appimage -f container/Containerfile.appimage container/

      # Same environment as container/build-appimage.sh, with the target dir
      # in the workspace so the caches above can save it. The container runs
      # as root on a checkout owned by the runner user: without safe.directory
      # git refuses the repo and build.rs embeds "unknown" as the version.
      - name: Build AppImage
        run: |
          mkdir -p target/cargo-registry
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/target/cargo-registry:/usr/local/cargo/registry" \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e VV_APPIMAGE_CONTAINER=1 \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/workspace \
            venturi-appimage scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Venturi-appimage-${{ runner.arch }}
          path: target/appimage/Venturi-*.AppImage
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: brew install pkgconf meson ninja

      # The compiled FFmpeg only changes with its build script.
      - uses: actions/cache@v4
        with:
          path: target/ffmpeg-shared
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: scripts/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Venturi-macos-arm64
          path: target/macos/Venturi-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
