name: macOS build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: brew install pkgconf

      # The compiled FFmpeg only changes with its build script.
      - uses: actions/cache@v4
        with:
          path: target/ffmpeg-shared
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: scripts/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Venturi-macos-arm64
          path: target/macos/Venturi-*.dmg
          if-no-files-found: error
